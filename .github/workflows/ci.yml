name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck jq iptables iproute2 python3
      - name: Синтаксис, shellcheck и тесты
        run: bash tests/run-all.sh
